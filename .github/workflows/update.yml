name: 2034 Watch

on:
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install feedparser google-generativeai

      - name: Run news collector
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python news.py
        
      - name: Save changes
        run: |
          git config --global user.name "2034 Watch Bot"
          git config --global user.email "2034-watch-bot@users.noreply.github.com"
          git add data.json
          git commit -m "Friss hírek és AI értékelések" || exit 0
          git pull --rebase origin main
          git push
