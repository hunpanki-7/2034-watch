name: 2034 Watch Hírfigyelő

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Repó letöltése
        uses: actions/checkout@v4

      - name: Python telepítése
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Szükséges csomagok telepítése
        run: pip install feedparser google-generativeai

      - name: Python script futtatása
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python parser.py

      - name: Frissített adatok visszatöltése a repóba
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "bot@github.com"
          git add data.json
          git commit -m "Automatikus heti hírfrissítés" || exit 0
          git push
