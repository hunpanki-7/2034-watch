<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2034 Watch</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f3f5f7;
    color: #222;
    margin: 0;
    padding: 0;
}

header {
    background: #243447;
    color: white;
    padding: 25px;
    text-align: center;
}

header h1 {
    margin: 0;
}

header p {
    margin-bottom: 0;
    opacity: 0.85;
}

.container {
    max-width: 1200px;
    margin: 25px auto;
    padding: 0 15px;
}

.summary {
    background: white;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 25px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
    gap: 20px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    display: flex;
    flex-direction: column;
}

.card h2 {
    margin-top: 0;
    color: #243447;
    font-size: 1.2rem;
    border-bottom: 2px solid #e8edf2;
    padding-bottom: 10px;
}

ul {
    list-style-type: disc;
    padding-left: 20px;
    margin: 0 0 15px 0;
    flex-grow: 1;
}

li {
    margin-bottom: 15px;
}

.goal-title {
    font-weight: bold;
    display: block;
    margin-bottom: 3px;
}

.goal-title a {
    color: #243447;
    text-decoration: none;
}

.goal-title a:hover {
    text-decoration: underline;
}

.goal-desc {
    font-size: 0.85rem;
    color: #555;
    margin-bottom: 6px;
}

select {
    padding: 6px;
    border-radius: 6px;
    border: 1px solid #bbb;
    font-size: 0.85rem;
    width: 100%;
    background: #fafafa;
}

button {
    padding: 9px 14px;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    background: #243447;
    color: white;
}

button:hover {
    opacity: 0.85;
}

footer {
    text-align: center;
    color: #777;
    padding: 30px;
    font-size: 13px;
}
</style>
</head>

<body>

<header>
    <h1>🌱 2034 Watch</h1>
    <p>Figyeljük, hogyan változik Magyarország 2034-ig.</p>
</header>

<div class="container">

    <div class="summary">
        <h2>2034-es célok</h2>
        <p>Ez az oldal a beérkezett hírek alapján követi a társadalmi, gazdasági és környezetvédelmi változásokat.</p>
        <button onclick="resetAll()">Állapotok visszaállítása</button>
    </div>

    <div class="grid" id="dashboard"></div>

</div>

<footer>
    2034 Watch — személyes projekt
</footer>

<script>
let newsData = [];

async function loadData() {
    try {
        const response = await fetch('data.json');
        newsData = await response.json();
        renderDashboard();
    } catch (error) {
        console.error("Hiba a data.json betöltésekor:", error);
        document.getElementById("dashboard").innerHTML = "<p>Nem sikerült betölteni a híreket.</p>";
    }
}

function getStatus(index) {
    return localStorage.getItem("status_" + index) || "⚪ Nincs még értékelve";
}

function setStatus(index, status) {
    localStorage.setItem("status_" + index, status);
}

function renderDashboard() {
    const container = document.getElementById("dashboard");
    container.innerHTML = "";

    const categories = {};
    newsData.forEach((item, index) => {
        const cat = item.category || "Egyéb";
        if (!categories[cat]) {
            categories[cat] = [];
        }
        categories[cat].push({ ...item, originalIndex: index });
    });

    for (const [categoryName, items] of Object.entries(categories)) {
        const card = document.createElement("div");
        card.className = "card";

        let listHTML = `<h2>${categoryName}</h2><ul>`;

        items.forEach(item => {
            const current = getStatus(item.originalIndex);
            listHTML += `
                <li>
                    <span class="goal-title"><a href="${item.link}" target="_blank">${item.title}</a></span>
                    <div class="goal-desc">${item.summary}</div>
                    <select onchange="setStatus(${item.originalIndex}, this.value)">
                        <option ${current === "⚪ Nincs még értékelve" ? "selected" : ""}>⚪ Nincs még értékelve</option>
                        <option ${current === "🟡 Előrelépés" ? "selected" : ""}>🟡 Előrelépés</option>
                        <option ${current === "🟢 Teljesült" ? "selected" : ""}>🟢 Teljesült</option>
                        <option ${current === "🟠 Visszalépés" ? "selected" : ""}>🟠 Visszalépés</option>
                        <option ${current === "🔴 Jelentős visszalépés" ? "selected" : ""}>🔴 Jelentős visszalépés</option>
                    </select>
                </li>
            `;
        });

        listHTML += `</ul>`;
        card.innerHTML = listHTML;
        container.appendChild(card);
    }
}

function resetAll() {
    if (confirm("Biztosan törölni szeretnéd az összes mentett állapotot?")) {
        newsData.forEach((_, index) => {
            localStorage.removeItem("status_" + index);
        });
        renderDashboard();
    }
}

loadData();
</script>

</body>
</html>
